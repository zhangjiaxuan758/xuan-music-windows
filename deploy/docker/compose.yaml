name: xuan

services:
  gateway:
    image: ${XUAN_IMAGE_NAMESPACE:?Set XUAN_IMAGE_NAMESPACE}/xuan-web:${XUAN_STACK_VERSION:-latest}
    restart: unless-stopped
    read_only: true
    environment:
      XUAN_AI_PROVIDER: ${XUAN_AI_PROVIDER:-google}
    ports:
      - "${XUAN_HTTP_BIND:-0.0.0.0}:${XUAN_HTTP_PORT:-18080}:8080"
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101,mode=0750
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
      netease-api:
        condition: service_healthy
      kugou-api:
        condition: service_healthy
    networks:
      - xuan-edge
      - xuan-internal
    security_opt:
      - no-new-privileges:true

  backend:
    image: ${XUAN_IMAGE_NAMESPACE:?Set XUAN_IMAGE_NAMESPACE}/xuan-web-api:${XUAN_STACK_VERSION:-latest}
    restart: unless-stopped
    read_only: true
    environment:
      PORT: "3000"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_URL: ${OPENAI_API_URL:-https://api.openai.com/v1}
      OPENAI_API_MODEL: ${OPENAI_API_MODEL:-gpt-4o}
      OPENAI_API_TEMPERATURE: ${OPENAI_API_TEMPERATURE:-0.7}
    expose:
      - "3000"
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - xuan-internal
      - xuan-egress
    security_opt:
      - no-new-privileges:true

  netease-api:
    image: ${XUAN_IMAGE_NAMESPACE:?Set XUAN_IMAGE_NAMESPACE}/xuan-netease-api:${XUAN_STACK_VERSION:-latest}
    restart: unless-stopped
    read_only: true
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      XUAN_FORWARD_CLIENT_IP: ${XUAN_FORWARD_CLIENT_IP:-false}
      ENABLE_GENERAL_UNBLOCK: ${ENABLE_GENERAL_UNBLOCK:-false}
    expose:
      - "3000"
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - xuan-internal
      - xuan-egress
    security_opt:
      - no-new-privileges:true

  kugou-api:
    image: ${XUAN_IMAGE_NAMESPACE:?Set XUAN_IMAGE_NAMESPACE}/xuan-kugou-api:${XUAN_STACK_VERSION:-latest}
    restart: unless-stopped
    read_only: true
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      XUAN_FORWARD_CLIENT_IP: ${XUAN_FORWARD_CLIENT_IP:-false}
    expose:
      - "3000"
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - xuan-internal
      - xuan-egress
    security_opt:
      - no-new-privileges:true

  sync-server:
    image: ${XUAN_IMAGE_NAMESPACE:?Set XUAN_IMAGE_NAMESPACE}/xuan-sync-server:${XUAN_SYNC_VERSION:-latest}
    restart: unless-stopped
    read_only: true
    environment:
      PORT: "3000"
      DB_PATH: /app/data/xuan-sync.db
      SYNC_TOKEN: ${SYNC_TOKEN:?Set SYNC_TOKEN to at least 8 characters}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
    ports:
      - "${XUAN_SYNC_BIND:-0.0.0.0}:${XUAN_SYNC_PORT:-13000}:3000"
    volumes:
      - "${XUAN_SYNC_DATA_DIR:-./data/sync}:/app/data"
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - xuan-sync
    security_opt:
      - no-new-privileges:true

networks:
  xuan-edge:
    driver: bridge
  xuan-internal:
    driver: bridge
    internal: true
  xuan-egress:
    driver: bridge
  xuan-sync:
    driver: bridge
